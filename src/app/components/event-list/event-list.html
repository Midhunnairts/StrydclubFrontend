<section class="events-section" id="events-display-section">
  <div class="events-container">
    
    <!-- Title Header Row -->
    <div class="events-header-row">
      <div class="events-title-block">
        <span class="events-eyebrow">HAPPENING SOON</span>
        <h2 class="events-title" id="events-title-header">
          <span>Featured</span>
          <span>Events</span>
        </h2>
      </div>

      <a routerLink="/events" class="link-all-events" id="link-all-events">
        <span>All events</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon-right-arrow">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </a>
    </div>

    <!-- Events Cards Grid -->
    <div class="events-grid" id="events-cards-grid">
      @for (event of events(); track event.title) {
        <div class="event-card" id="event-card-{{ event.category.toLowerCase() }}">
          
          <!-- Card Top Image Header -->
          <div class="card-image-wrapper" style="background-image: url('{{ event.image }}');">
            <div class="image-gradient-overlay"></div>

            <!-- Category Badge (Top Left) -->
            <div class="badge-category">
              <span>{{ event.category }}</span>
            </div>

            <!-- Price Tag Pill (Top Right) -->
            <div class="badge-price">
              <span>₹{{ event.price }}</span>
            </div>
          </div>

          <!-- Card Content Body -->
          <div class="event-card-body">
            <h3 class="event-name">{{ event.title }}</h3>
            
            <ul class="event-meta-details">
              <!-- Date & Time Row -->
              <li class="meta-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="meta-icon">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                </svg>
                <span>{{ event.date }}</span>
              </li>

              <!-- Location Row -->
              <li class="meta-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="meta-icon">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
                <span>{{ event.location }}</span>
              </li>
            </ul>

            <!-- Slots Tracker & Progress Bar -->
            <div class="event-slots-tracker">
              <div class="tracker-labels">
                <span class="label-title">Slots left</span>
                <span class="label-count">{{ event.slotsFilled }}/{{ event.slotsTotal }}</span>
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" [style.width.%]="getSlotsPercentage(event)"></div>
              </div>
            </div>

            <!-- Full Width White Capsule Action CTA Button -->
            <a [routerLink]="['/events', event.id]" class="btn-register-action" id="btn-register-{{ event.category.toLowerCase() }}">
              Register Now
            </a>
          </div>

        </div>
      }
    </div>

  </div>
</section>
