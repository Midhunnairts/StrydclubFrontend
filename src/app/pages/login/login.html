<section class="login-page-section" id="login-main-view">
  <div class="login-page-container">
    
    <!-- Title Headers -->
    <div class="login-page-header">
      <h1 class="page-title" id="login-main-title">Welcome Back</h1>
      <p class="page-subtitle" id="login-main-subtitle">Sign in to continue your journey</p>
    </div>

    <!-- Login Card Container -->
    <div class="login-card" id="login-card-container">
      
      <!-- Toggles Tabs (Phone / Email) -->
      <div class="tab-toggle-row">
        <button type="button" class="tab-btn" [class.active]="activeTab() === 'phone'" (click)="setTab('phone')" id="tab-phone-trigger">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="tab-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-2.824-1.502-5.176-3.854-6.678-6.678l1.293-.97a2.25 2.25 0 0 0 .417-1.173L6.113 3.243c-.125-.501-.575-.852-1.091-.852H3.75a2.25 2.25 0 0 0-2.25 2.25v2.25Z" />
          </svg>
          <span>Phone</span>
        </button>
        <button type="button" class="tab-btn" [class.active]="activeTab() === 'email'" (click)="setTab('email')" id="tab-email-trigger">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="tab-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
          <span>Email</span>
        </button>
      </div>

      <!-- Login Dynamic Form -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form" id="login-auth-form">
        
        <!-- Dynamic Input Field Group -->
        @if (activeTab() === 'phone') {
          <div class="form-group" id="form-group-phone">
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <input type="text" id="phoneNumber" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="+91 98765 43210" class="form-input" required />
          </div>
        } @else {
          <div class="form-group" id="form-group-email">
            <label for="emailAddress" class="form-label">Email Address</label>
            <input type="email" id="emailAddress" name="emailAddress" [(ngModel)]="emailAddress" placeholder="your.email@example.com" class="form-input" required />
          </div>
        }

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-action" [disabled]="!loginForm.form.valid" id="btn-submit-auth">
          <span>{{ activeTab() === 'phone' ? 'Send OTP' : 'Continue' }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="btn-arrow">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
          </svg>
        </button>

      </form>

      <!-- or continue with Separator -->
      <div class="separator-row">
        <span class="separator-text">or continue with</span>
      </div>

      <!-- Third-Party Google Auth -->
      <button type="button" class="btn-google-auth" (click)="loginWithGoogle()" id="btn-google-login">
        <svg class="google-logo" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Google</span>
      </button>

    </div>

    <!-- Legal Terms of Service / Privacy Policy Footer -->
    <p class="legal-footer">
      By continuing, you agree to Strydclub's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </p>

  </div>
</section>
