<section class="onboarding-page-section">
  <div class="onboarding-glow-backdrop"></div>

  <div class="onboarding-card-wrapper">
    <!-- Brand Header -->
    <div class="onboarding-brand-header">
      <div class="stryd-logo">
        <span class="logo-stryd">STRYD</span><span class="logo-club">CLUB</span>
      </div>
      <span class="welcome-badge">WELCOME ATHLETE</span>
      <h1 class="onboarding-title">Complete Your Profile</h1>
      <p class="onboarding-subtitle">Personalize your athlete profile to start joining runs, matches, and local events.</p>
    </div>

    <!-- Error Alert Message -->
    @if (errorMessage()) {
      <div class="alert-error-banner">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Onboarding Form -->
    <form (ngSubmit)="onSubmit()" class="onboarding-form">
      <!-- Full Name Field -->
      <div class="form-group-block">
        <label for="fullNameInput" class="form-input-label">Full Name <span class="required-asterisk">*</span></label>
        <div class="input-field-container">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            id="fullNameInput"
            type="text"
            [(ngModel)]="fullName"
            name="fullName"
            placeholder="e.g. Arjun Sharma"
            class="onboarding-input"
            required
          />
        </div>
      </div>

      <!-- City / Location Field -->
      <div class="form-group-block">
        <label for="locationInput" class="form-input-label">City / Place <span class="required-asterisk">*</span></label>
        <div class="input-field-container">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <input
            id="locationInput"
            type="text"
            [(ngModel)]="location"
            name="location"
            placeholder="e.g. Bangalore, Mumbai, Delhi"
            class="onboarding-input"
            required
          />
        </div>
      </div>

      <!-- Complementary Contact Input Row -->
      @if (loginChannel === 'phone') {
        <!-- Phone is verified, Email is required -->
        <div class="form-group-block">
          <label class="form-input-label">Phone Number <span class="verified-pill">✓ Verified</span></label>
          <div class="input-field-container disabled-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input type="text" [value]="phone" class="onboarding-input readonly-input" disabled />
          </div>
        </div>

        <div class="form-group-block">
          <label for="emailInput" class="form-input-label">Email Address <span class="required-asterisk">*</span></label>
          <div class="input-field-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              id="emailInput"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="e.g. arjun@email.com"
              class="onboarding-input"
              required
            />
          </div>
        </div>
      } @else {
        <!-- Email is verified, Phone is required -->
        <div class="form-group-block">
          <label class="form-input-label">Email Address <span class="verified-pill">✓ Verified</span></label>
          <div class="input-field-container disabled-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" [value]="email" class="onboarding-input readonly-input" disabled />
          </div>
        </div>

        <div class="form-group-block">
          <label for="phoneInput" class="form-input-label">Phone Number <span class="required-asterisk">*</span></label>
          <div class="input-field-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input
              id="phoneInput"
              type="tel"
              [(ngModel)]="phone"
              name="phone"
              placeholder="e.g. +91 9876543210"
              class="onboarding-input"
              required
            />
          </div>
        </div>
      }

      <!-- Favorite Sports Chip Selection -->
      <div class="form-group-block">
        <label class="form-input-label">Favorite Sports</label>
        <div class="sports-chips-grid">
          @for (sport of availableSports; track sport.name) {
            <button
              type="button"
              class="sport-chip-btn"
              [class.selected]="isSportSelected(sport.name)"
              (click)="toggleSport(sport.name)">
              <span class="chip-icon">{{ sport.icon }}</span>
              <span>{{ sport.name }}</span>
              @if (isSportSelected(sport.name)) {
                <span class="chip-check">✓</span>
              }
            </button>
          }
        </div>
      </div>

      <!-- Action Button -->
      <button type="submit" class="btn-submit-onboarding" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-loader"></span>
          <span>Saving Profile...</span>
        } @else {
          <span>Complete Profile & Continue</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        }
      </button>
    </form>
  </div>
</section>
